# Local JavaFX overrides for Syndicati.
#
# The shared demo configuration is loaded from Infisical through the root .env file.
# Keep this file free of real passwords, API keys, database URLs, OAuth secrets, and tokens.
# Use it only for harmless local toggles or machine-specific development values.

# Example local overrides, disabled by default:
# APP_ENV=dev
# DATABASE_URL=your-local-database-url
# MAILER_DSN=null://null
# IMAGEKIT_ENABLED=false

### Observability defaults ###
openobserve.enabled=false
openobserve.url=http://localhost:5080
openobserve.username=admin
openobserve.password=
openobserve.stream_name=syndicati
openobserve.batch_size=10
openobserve.batch_timeout_ms=5000

langfuse.enabled=false
langfuse.base_url=https://cloud.langfuse.com
langfuse.public_key=
langfuse.secret_key=

logai.enabled=false
logai.worker_url=http://127.0.0.1:8001
logai.batch_size=100
logai.timeout_seconds=30
logai.schedule_interval_seconds=60
logai.anomaly_threshold=0.65
